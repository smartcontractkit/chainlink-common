name: Changed Go modules
description: |
  The Go modules a run checks: every module on a push, on a run without a changeset, or when
  anything under .github changes; otherwise each module with a changed file anywhere under it
  outside a nested module, since a file need not be Go to be built in, as an embedded one is.
  The commentparsing examples count as x/config: they are modules only to model a downstream
  consumer, which takes the local replace directives gomoddirectives rejects, and x/config's run
  builds and regenerates them. Expects a checkout with full history.

outputs:
  modules:
    description: A JSON array of module paths relative to the repository root, the root module as ".".
    value: ${{ steps.resolve.outputs.modules }}

runs:
  using: composite
  steps:
    - name: Modules with changed files
      id: changed
      uses: smartcontractkit/.github/actions/changed-modules-go@changed-modules-go/v1
      with:
        no-change-behaviour: all
        file-patterns: "**"
        module-patterns: |
          **
          !**/vendor/**

    - name: Workflow changes
      id: workflows
      uses: smartcontractkit/.github/actions/changed-modules-go@changed-modules-go/v1
      with:
        no-change-behaviour: none
        file-patterns: .github/**

    - name: Resolve modules
      id: resolve
      shell: bash
      env:
        CHANGED: ${{ steps.changed.outputs.modules-json }}
        WORKFLOWS: ${{ steps.workflows.outputs.modules-json }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == push || ( -n "$WORKFLOWS" && "$WORKFLOWS" != "[]" ) ]]; then
          modules=$(git ls-files '*go.mod' | grep -v /examples/ | xargs -n1 dirname | jq -Rsc 'split("\n") | map(select(. != ""))')
        else
          modules=$(jq -c 'map(if startswith("x/config/commentparsing/examples/") then "x/config" else . end) | unique' <<< "$CHANGED")
        fi
        echo "modules=$modules" | tee -a "$GITHUB_OUTPUT"
