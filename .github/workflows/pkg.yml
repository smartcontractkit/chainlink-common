name: PKG Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: "go.mod"
          restore-build-cache-only: "false"

      - name: Build
        run: go build -v ./...

      - name: Download gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Unit Tests
        id: run-tests
        continue-on-error: true
        run: gotestsum --format standard-quiet --junitfile test-results.xml -- ./... -coverpkg=./... -coverprofile=coverage.txt

      - name: Analyze and upload test results
        uses: smartcontractkit/.github/actions/branch-out-upload@branch-out-upload/v1
        with:
          junit-file-path: test-results.xml
          trunk-org-slug: chainlink
          trunk-previous-step-outcome: ${{ steps.run-tests.outcome }}
          trunk-token: ${{ secrets.TRUNK_API_KEY }}
          trunk-job-url: ${{ format('https://github.com/{0}/actions/runs/{1}/job/{2}/attempts/{3}', github.repository, github.run_id, job.check_run_id, github.run_attempt) }}

      - name: Fuzz Tests
        # the amount of --seconds here is subject to change based on how long the CI job takes in the future
        # as we add more fuzz tests, we should take into consideration increasing this timelapse, so we can have enough coverage.
        # We are timing out after ~10mins in case the tests hang. (Current CI duration is ~7m, modify if needed)
        # See https://github.com/golang/go/issues/52569 there's a bug that causes fuzz tests to fail if they run too long.
        # 12s was working for a long time in core, and always ran successfully for > 12 s for this repo before failing too.
        # Note: Users in a linked issue said that it took hours to fail on a mac, vs seconds or minutes on linux.
        run: cd fuzz && timeout 10m ./fuzz_all_native.py --ci --seconds 12

      - name: Log Fuzz Tests Failing Inputs
        if: failure()
        run: find . -type f|fgrep '/testdata/fuzz/'|while read f; do echo $f; cat $f; done

      - name: Upload Go test coverage
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: go-test-coverage
          path: |
            ./coverage.txt

  build-race-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: "go.mod"

      - name: Build
        run: go build -v ./...

      - name: Race Tests
        run: GORACE="log_path=$PWD/race" go test -race ./...

      - name: Print Races
        if: failure()
        id: print-races
        run: |
          find race.* | xargs cat > race.txt
          if [[ -s race.txt ]]; then
            cat race.txt
          fi

      - name: Upload Go test results
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: go-race-results
          path: |
            ./race.*

  check-gofix:
    runs-on: ubuntu-latest
    # Non-required while we evaluate it; failure won't block merges.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect changed modules
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          # "root" is the catch-all: any .go file outside the nested modules
          # listed below, including locations not yet enumerated here (e.g.
          # a new top-level package).
          filters: |
            root:
              - '**/*.go'
              - '!keystore/**'
              - '!observability-lib/**'
              - '!pkg/values/**'
              - '!pkg/chipingress/**'
              - '!pkg/monitoring/**'
              - '!pkg/workflows/sdk/v2/pb/**'
            keystore:
              - 'keystore/**/*.go'
            observability-lib:
              - 'observability-lib/**/*.go'
            pkg-values:
              - 'pkg/values/**/*.go'
            pkg-chipingress:
              - 'pkg/chipingress/**/*.go'
            pkg-monitoring:
              - 'pkg/monitoring/**/*.go'
            pkg-workflows-sdk-v2-pb:
              - 'pkg/workflows/sdk/v2/pb/**/*.go'

      - name: Set up Go
        if: steps.filter.outputs.root == 'true' || steps.filter.outputs.keystore == 'true' || steps.filter.outputs.observability-lib == 'true' || steps.filter.outputs.pkg-values == 'true' || steps.filter.outputs.pkg-chipingress == 'true' || steps.filter.outputs.pkg-monitoring == 'true' || steps.filter.outputs.pkg-workflows-sdk-v2-pb == 'true'
        uses: ./.github/actions/setup-go
        with:
          go-version-file: "go.mod"
          only-modules: "true"

      - name: Ensure "go fix" has been run on changed modules
        if: steps.filter.outputs.root == 'true' || steps.filter.outputs.keystore == 'true' || steps.filter.outputs.observability-lib == 'true' || steps.filter.outputs.pkg-values == 'true' || steps.filter.outputs.pkg-chipingress == 'true' || steps.filter.outputs.pkg-monitoring == 'true' || steps.filter.outputs.pkg-workflows-sdk-v2-pb == 'true'
        env:
          ROOT_CHANGED: ${{ steps.filter.outputs.root }}
          KEYSTORE_CHANGED: ${{ steps.filter.outputs.keystore }}
          OBSERVABILITY_LIB_CHANGED: ${{ steps.filter.outputs.observability-lib }}
          PKG_VALUES_CHANGED: ${{ steps.filter.outputs.pkg-values }}
          PKG_CHIPINGRESS_CHANGED: ${{ steps.filter.outputs.pkg-chipingress }}
          PKG_MONITORING_CHANGED: ${{ steps.filter.outputs.pkg-monitoring }}
          PKG_WORKFLOWS_SDK_V2_PB_CHANGED: ${{ steps.filter.outputs.pkg-workflows-sdk-v2-pb }}
        run: |
          [[ "$ROOT_CHANGED" == "true" ]] && { (cd . && go fix ./...) || exit 1; } || true
          [[ "$KEYSTORE_CHANGED" == "true" ]] && { (cd keystore && go fix ./...) || exit 1; } || true
          [[ "$OBSERVABILITY_LIB_CHANGED" == "true" ]] && { (cd observability-lib && go fix ./...) || exit 1; } || true
          [[ "$PKG_VALUES_CHANGED" == "true" ]] && { (cd pkg/values && go fix ./...) || exit 1; } || true
          [[ "$PKG_CHIPINGRESS_CHANGED" == "true" ]] && { (cd pkg/chipingress && go fix ./...) || exit 1; } || true
          [[ "$PKG_MONITORING_CHANGED" == "true" ]] && { (cd pkg/monitoring && go fix ./...) || exit 1; } || true
          [[ "$PKG_WORKFLOWS_SDK_V2_PB_CHANGED" == "true" ]] && { (cd pkg/workflows/sdk/v2/pb && go fix ./...) || exit 1; } || true
          git add --all
          git diff --minimal --cached --exit-code

  check-tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: "go.mod"
          only-modules: "true"

      - name: Ensure "make gomodtidy" has been run
        run: |
          make gomodtidy
          git add --all
          git diff --minimal --cached --exit-code

      - name: Ensure "make generate" has been run
        run: |
          make rm-mocked
          make rm-builders
          make generate
          git add --all
          git diff --stat --cached --exit-code
