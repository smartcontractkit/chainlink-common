name: SonarQube Scan

on: [push]

# Reading other workflows' runs and artifacts takes actions: read.
permissions:
  contents: read
  actions: read

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    # The steps of smartcontractkit/.github's ci-sonarqube-go, pinned to this commit's reports. That
    # action takes the newest artifact of one fixed name from any branch, and lint artifacts here
    # are named per module.
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for reports
        # A pull request's runs are created a few seconds after the push that starts this one, so
        # waiting for whatever runs exist can finish before they do. Wait for this commit's report
        # runs by name: briefly for them to appear, since a push outside a pull request gets none,
        # then for them to complete.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One deadline for both workflows, so a push with neither waits once, not twice.
          appear_by=$((SECONDS + 180))
          finish_by=$((SECONDS + 3600))
          for workflow in pkg.yml golangci_lint.yml; do
            while true; do
              # true when every run completed, none when no run exists yet; a failed call retries.
              state=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$GITHUB_SHA" \
                --json status --jq 'if length == 0 then "none" else (all(.status == "completed") | tostring) end' \
                || echo retry)
              if [[ "$state" == true ]]; then
                break
              elif [[ "$state" == none && $SECONDS -gt $appear_by ]]; then
                echo "No $workflow run for $GITHUB_SHA"
                break
              elif [[ $SECONDS -gt $finish_by ]]; then
                echo "::warning::$workflow did not complete for $GITHUB_SHA"
                break
              fi
              sleep 20
            done
          done

      - name: Download coverage reports
        uses: dawidd6/action-download-artifact@634d83b91986fcec9be314054943fa5c976aeb0e # v25
        with:
          workflow: pkg.yml
          name: go-test-coverage-.*
          name_is_regexp: true
          commit: ${{ github.sha }}
          search_artifacts: true
          workflow_conclusion: ""
          # Every push to main has its reports; a push elsewhere has them only if it is a pull request's.
          if_no_artifact_found: ${{ github.ref_name == 'main' && 'fail' || 'warn' }}
          path: sonar-reports/coverage

      - name: Download lint reports
        uses: dawidd6/action-download-artifact@634d83b91986fcec9be314054943fa5c976aeb0e # v25
        with:
          workflow: golangci_lint.yml
          name: golangci-lint-report-.*
          name_is_regexp: true
          commit: ${{ github.sha }}
          search_artifacts: true
          workflow_conclusion: ""
          # Every push to main has its reports; a push elsewhere has them only if it is a pull request's.
          if_no_artifact_found: ${{ github.ref_name == 'main' && 'fail' || 'warn' }}
          path: sonar-reports/lint

      - name: Set SonarQube Report Paths
        # Lint runs only when Go files change, so a commit may have no reports to pass.
        run: |
          mkdir -p sonar-reports
          coverage=$(find sonar-reports -type f -name coverage.txt -printf "%p,")
          lint=$(find sonar-reports -type f -name golangci-lint-report.xml -printf "%p,")
          args=""
          [[ -n "$coverage" ]] && args="$args -Dsonar.go.coverage.reportPaths=$coverage"
          [[ -n "$lint" ]] && args="$args -Dsonar.go.golangci-lint.reportPaths=$lint"
          echo "SONARQUBE_ARGS=$args" >> "$GITHUB_ENV"

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: ${{ env.SONARQUBE_ARGS }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
