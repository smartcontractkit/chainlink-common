name: PKG Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

permissions:
  contents: read

# Every check runs in one job per module the change touches, so a module's run can be re-run and
# read on its own, and the checks share one runner and one setup. The checks run in turn, each even
# if one before it failed, so a run reports every failure at once. The tidy and generate checks go
# first, diffing a checkout nothing else has written to yet, and put it back if they fail.
#
# Branch protection requires build-test, build-race-tests, check-tidy and summary gate. Each fails
# if any module's run failed; the step that failed tells which check it was.
jobs:
  detect-modules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      modules: ${{ steps.changed-modules.outputs.modules }}
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Changed modules
        id: changed-modules
        uses: ./.github/actions/changed-modules

  module:
    name: module (${{ matrix.module }})
    needs: detect-modules
    if: needs.detect-modules.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-modules.outputs.modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      MODULE: ${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          # hashFiles rejects ./go.sum, so the root module's files are named bare.
          go-version-file: ${{ matrix.module == '.' && 'go.mod' || format('{0}/go.mod', matrix.module) }}
          go-module-file: ${{ matrix.module == '.' && 'go.sum' || format('{0}/go.sum', matrix.module) }}
          build-cache-version: ${{ matrix.module }}
          restore-build-cache-only: "false"

      - name: Artifact suffix
        id: suffix
        run: |
          suffix=${MODULE//\//-}
          echo "value=${suffix/#./root}" | tee -a "$GITHUB_OUTPUT"

      - name: Build
        run: go build -v ./...

      - name: Build examples
        # The examples are modules of their own, modelling a consumer of the library, so the
        # module's ./... does not reach them.
        if: matrix.module == 'x/config'
        run: |
          go -C commentparsing/examples/separate_module_use/upstream build ./...
          go -C commentparsing/examples/separate_module_use build ./...

      - name: Install generators
        # go.md graphs every module, so each module's run regenerates it.
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          make mockery install-protoc cre-protoc modgraph
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Ensure "go mod tidy" has been run
        if: ${{ !cancelled() }}
        run: |
          go mod tidy
          if [[ "$MODULE" == x/config ]]; then
            go -C commentparsing/examples/separate_module_use/upstream mod tidy
            go -C commentparsing/examples/separate_module_use mod tidy
          fi
          git add --all
          git diff --minimal --cached --exit-code || { git reset -q --hard && git clean -fdq && exit 1; }

      - name: Ensure "go generate" has been run
        if: ${{ !cancelled() }}
        run: |
          grep -rl "^// Code generated by mockery" --include='*.go' . | xargs -r rm
          go generate -x ./...
          find . -type f -name .mockery.yaml -execdir mockery \;
          if [[ "$MODULE" == x/config ]]; then
            go -C commentparsing/examples/separate_module_use generate ./...
          fi
          git add --all
          git diff --stat --cached --exit-code || { git reset -q --hard && git clean -fdq && exit 1; }

      - name: Download gotestsum
        if: ${{ !cancelled() }}
        run: go install gotest.tools/gotestsum@latest

      - name: Unit Tests
        id: run-tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: gotestsum --format standard-quiet --junitfile "$RUNNER_TEMP/test-results.xml" -- ./... -coverpkg=./... -coverprofile="$RUNNER_TEMP/coverage.txt"

      - name: Analyze and upload test results
        if: ${{ !cancelled() }}
        uses: smartcontractkit/.github/actions/branch-out-upload@branch-out-upload/v1
        with:
          junit-file-path: ${{ runner.temp }}/test-results.xml
          trunk-org-slug: chainlink
          trunk-previous-step-outcome: ${{ steps.run-tests.outcome }}
          trunk-token: ${{ secrets.TRUNK_API_KEY }}
          trunk-job-url: ${{ format('https://github.com/{0}/actions/runs/{1}/job/{2}/attempts/{3}', github.repository, github.run_id, job.check_run_id, github.run_attempt) }}

      - name: Upload Go test coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: go-test-coverage-${{ steps.suffix.outputs.value }}
          path: ${{ runner.temp }}/coverage.txt

      - name: Fuzz Tests
        # the amount of --seconds here is subject to change based on how long the CI job takes in the future
        # as we add more fuzz tests, we should take into consideration increasing this timelapse, so we can have enough coverage.
        # We are timing out after ~10mins in case the tests hang. (Current CI duration is ~7m, modify if needed)
        # See https://github.com/golang/go/issues/52569 there's a bug that causes fuzz tests to fail if they run too long.
        # 12s was working for a long time in core, and always ran successfully for > 12 s for this repo before failing too.
        # Note: Users in a linked issue said that it took hours to fail on a mac, vs seconds or minutes on linux.
        # The root module's fuzzers live under pkg.
        if: ${{ !cancelled() }}
        working-directory: fuzz
        run: |
          root="../$MODULE"
          [[ "$MODULE" == . ]] && root=../pkg
          timeout 10m ./fuzz_all_native.py --ci --seconds 12 --root "$root"

      - name: Log Fuzz Tests Failing Inputs
        if: failure()
        run: find . -type f|fgrep '/testdata/fuzz/'|while read f; do echo $f; cat $f; done

      - name: Race Tests
        if: ${{ !cancelled() }}
        run: GORACE="log_path=$RUNNER_TEMP/race" go test -race ./...

      - name: Print Races
        if: failure()
        run: |
          find "$RUNNER_TEMP"/race.* 2>/dev/null | xargs -r cat > "$RUNNER_TEMP/race.txt"
          if [[ -s "$RUNNER_TEMP/race.txt" ]]; then
            cat "$RUNNER_TEMP/race.txt"
          fi

      - name: Upload Go race results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: go-race-results-${{ steps.suffix.outputs.value }}
          path: ${{ runner.temp }}/race.*


  build-test:
    needs: [detect-modules, module]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every module's run to pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  build-race-tests:
    needs: [detect-modules, module]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every module's run to pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  check-tidy:
    needs: [detect-modules, module]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every module's run to pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  summary-gate:
    name: summary gate
    needs: [detect-modules, module]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every module's run to pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
