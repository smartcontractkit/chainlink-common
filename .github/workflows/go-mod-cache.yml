name: Go Module Cache

# This workflow is responsible for updating the Go Module Cache.
# It will maintain a cache per module: linux-gomod-1-<hash of its go.sum>
# All other workflows should only restore this cache.

# This workflow is useful because it will:
# 1. Create the cache if it doesn't exist
#   - This can be a problem when multiple jobs load the same cache.
#     Only one will get priority to create the cache.
# 2. Should not fail, therefore creating a cache
#   - When a Job errors/fails it will not upload a new cache.
#     So when test/build jobs are responsible for creating the new cache,
#     they can fail causing cache misses on subsequent runs. Even though
#     the dependencies haven't changed.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  modules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: List modules
        id: modules
        run: echo "modules=$(script/go-modules.sh | jq -Rsc 'split("\n") | map(select(. != ""))')" | tee -a "$GITHUB_OUTPUT"

  go-cache:
    # Each module's cache is keyed by its own go.sum, so each is filled by its own run.
    name: Go Mod Cache (${{ matrix.module }})
    needs: modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.modules) }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        id: setup-go
        uses: ./.github/actions/setup-go
        with:
          # hashFiles rejects ./go.sum, so the root module's files are named bare.
          go-version-file: ${{ matrix.module == '.' && 'go.mod' || format('{0}/go.mod', matrix.module) }}
          go-module-file: ${{ matrix.module == '.' && 'go.sum' || format('{0}/go.sum', matrix.module) }}
          only-modules: "true"
          restore-module-cache-only: "false"

      - name: Install Dependencies
        if: ${{ steps.setup-go.outputs.primary-cache-hit-modules != 'true' }}
        shell: bash
        env:
          MODULE: ${{ matrix.module }}
        run: |
          echo "::group::go mod download"
          # A module's examples are built in its run, so their dependencies share its cache.
          for module in "$MODULE" $(script/go-modules.sh examples "$MODULE"); do
            go -C "$module" mod download
          done
          echo "::endgroup::"
