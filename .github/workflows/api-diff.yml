name: Analyze API Changes

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  api-diff:
    uses: smartcontractkit/.github/.github/workflows/reusable-apidiff-go-analysis.yml@reusable-apidiff-go-analysis/v1
    with:
      file-patterns: |
        **/*.go
        **/go.mod
        **/go.sum
      # x/ is where a module lives while its API is still being settled, so a breaking change
      # there is the point rather than a regression to gate.
      module-patterns: |
        **
        !x/**
      enforce-compatible: ${{ !contains(github.event.pull_request.labels.*.name, 'allow-incompatible') }}
